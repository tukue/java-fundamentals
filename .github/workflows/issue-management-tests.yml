name: Issue Management Tests

on:
  push:
    paths:
      - "issue-management/**"
      - ".github/workflows/issue-management-tests.yml"
  pull_request:
    paths:
      - "issue-management/**"
      - ".github/workflows/issue-management-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: issue-management
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: issue-management/pom.xml

      - name: Run tests
        run: mvn --batch-mode test
